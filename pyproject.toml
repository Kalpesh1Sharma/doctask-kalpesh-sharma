[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "task1"
version = "0.1.0"
description = "Task 1 document analysis and review system"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "pydantic-settings>=2.7,<3.0",
    "pypdf>=5.0,<7.0",
    "python-docx>=1.1,<2.0",
    "openai>=1.65,<3.0",
    "groq>=1.6,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "mcp>=2.0,<3.0",
]

[project.scripts]
task1-mcp = "api.mcp.server:main"
task1-watch = "runtime.watch_folder:main"
task1-worker = "runtime.run_worker:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.egg-info"]
